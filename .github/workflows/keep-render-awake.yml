name: Keep Render Scanner Awake

on:
  schedule:
    # Avoid the busiest minute at the start of each hour.
    - cron: "3-59/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keep-render-awake
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping Beefy Bot health endpoint
        run: |
          for attempt in 1 2 3; do
            health=$(curl --fail --silent --show-error --max-time 30 \
              https://beefy-bot.onrender.com/health) || health=""
            if [ -n "$health" ]; then
              echo "$health"
              if printf '%s' "$health" | jq -e '
                .bot == "ok" and .scanner == "running" and .scanner_cycle_fresh == true
                and (.wallet_discovery == "inactive" or .wallet_discovery == "healthy")
                and .feed_errors["platform-launches:base"] == null
                and .feed_errors["rpc-pairs:base"] == null
                and .feed_errors["smart-wallets"] == null
                and .telegram_delivery != "error"
              ' >/dev/null; then
                exit 0
              fi
            fi
            sleep 10
          done
          echo "Beefy scanner, wallet feed, or Telegram delivery needs attention" >&2
          exit 1
