name: Keep Render Scanner Awake

on:
  schedule:
    # Avoid the busiest minute at the start of each hour.
    - cron: "3-59/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keep-render-awake
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping Beefy Bot health endpoint
        run: >-
          curl --fail --silent --show-error
          --max-time 90
          --retry 2
          --retry-delay 5
          --retry-all-errors
          https://beefy-bot.onrender.com/health
