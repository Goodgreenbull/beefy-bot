name: Test Beefy Bot

on:
  pull_request:
  push:
    branches:
      - main
      - feature/first-leg-scanner

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile source
        run: python -m compileall -q server.py scanner tests

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  live-smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Confirm Render deployed this commit and completed a scan
        env:
          EXPECTED_RELEASE: ${{ github.sha }}
        run: |
          for attempt in $(seq 1 30); do
            health=$(curl --fail --silent --show-error --max-time 12 https://beefy-bot.onrender.com/health) || health=""
            if [ -n "$health" ]; then
              echo "$health"
              if printf '%s' "$health" | jq -e --arg release "${EXPECTED_RELEASE:0:12}" '
                .bot == "ok" and .scanner == "running"
                and .release == $release and .last_cycle_at != null
              ' >/dev/null; then
                exit 0
              fi
            fi
            sleep 20
          done
          echo "Render did not report this commit with a completed scan within the smoke-check window" >&2
          exit 1
