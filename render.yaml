services:
  - type: web
    name: beefy-bot
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: hypercorn server:app --bind 0.0.0.0:$PORT
    healthCheckPath: /health
    envVars:
      - key: SCANNER_ENABLED
        value: "true"
      - key: SCANNER_INTERVAL_SECONDS
        value: "300"
      - key: SCANNER_ACTIVE_LIMIT
        value: "50"
      - key: SCANNER_MIN_ALERT_SCORE
        value: "70"
      - key: SCANNER_STRONG_ALERT_SCORE
        value: "80"
      - key: SCANNER_SCOUT_ALERT_SCORE
        value: "60"
      - key: SCANNER_EXCEPTIONAL_SCOUT_SCORE
        value: "55"
      - key: SCANNER_MAX_ALERTS_PER_CYCLE
        value: "3"
      - key: SCANNER_TOKEN_REALERT_HOURS
        value: "24"
      - key: SCANNER_WARMUP_CYCLES
        value: "1"
      - key: SCANNER_AUTO_CALIBRATE
        value: "true"
      - key: SCANNER_OUTCOME_MISSING_CONFIRMATIONS
        value: "3"
      - key: SCANNER_AUTO_CURATE_SMART_WALLETS
        value: "true"
      - key: SCANNER_SECURITY_CACHE_MINUTES
        value: "30"
      - key: SCANNER_SECURITY_CHECK_MIN_SCORE
        value: "45"
      - key: SCANNER_MAX_FLOW_CHECKS
        value: "12"
      - key: SCANNER_MAX_ROBINHOOD_MARKET_CHECKS
        value: "18"
